# Chip LEDs (mm), the input of the chip-LED footprint and STEP model generator (kilib::chip::led).
# One footprint and model per (size, height, colour): LED_0603_1608Metric_H0.8_Red. Decided 13 Nov 2026: 0402 and 0603,
# every height the makers sell (heights within 0.1 mm merged, rounding up), red, orange, yellow, green, blue and white.
# Heights, board (substrate) thickness and lens length are read from the makers' package drawings. The lens is flat;
# Kingbright's domed parts (APHD1608, APTD1608) are drawn as a box enclosing the dome. A white LED's lens is its
# yellow phosphor.

# ---------------------------------------------------------------- 0402 (1005)

# 0.2: a flat clear layer over the whole top, no moulded lens.
[[led]]
size = "0402"
metric = "1005"
length = 1.0
width = 0.5
height = 0.2
board_thickness = 0.13
lens_length = 1.0
band = 0.25
board = "white"
lens = "clear"
colours = ["Red", "Orange", "Yellow", "Green", "Blue", "White"]
sources = [
  "LiteOn LTST-C283KGKT-5A, package dimensions p.1: H 0.20, board 0.13",
  "Kingbright APG1005ZGC-5MAV and APG1005VWF-A1-5MAV (white, yellow phosphor), package dimensions p.1: H 0.20",
]

