# Layer presets for the PCB Editor, written into a project's .kicad_pro (board.layer_presets) by `kilib presets`.
# `layers`: board layers shown, by kilib's names (`kilib layers`) or KiCad's own (F.Cu, Edge.Cuts, F.Courtyard...);
# the first one becomes the preset's active layer. `render`: the object types shown (KiCad's "Objects" tab;
# anything not listed is hidden: footprints_front/back carry the footprints' graphics, footprint_text the
# designators, values, Crit/Imp notes and pin numbers; board_outline_area and Edge.Cuts in every preset).
# `flip` views the board from below, for a back-side preset. Decided 14 Nov 2026.

[[preset]]
name = "Layout.F"
layers = ["F.Cu", "F.Fab", "Crit.F", "Imp.F", "Ref.Des.F", "F.Courtyard", "Edge.Cuts"]
render = ["tracks", "vias", "pads", "zones", "shapes", "bitmaps", "footprints_front", "footprints_back", "footprint_values", "footprint_references", "footprint_text", "drc_warnings", "drc_errors", "locked_item_shadows", "conflict_shadows", "board_outline_area", "drawing_sheet", "grid", "ratsnest"]
flip = false

[[preset]]
name = "Layout.B"
layers = ["B.Cu", "B.Fab", "Crit.B", "Imp.B", "Ref.Des.B", "B.Courtyard", "Edge.Cuts"]
render = ["tracks", "vias", "pads", "zones", "shapes", "bitmaps", "footprints_front", "footprints_back", "footprint_values", "footprint_references", "footprint_text", "drc_warnings", "drc_errors", "locked_item_shadows", "conflict_shadows", "board_outline_area", "drawing_sheet", "grid", "ratsnest"]
flip = true

