# Current-sense resistors with a metal element: bodies, terminations and the makers' lands.
#
# One [[shunt]] row per series, size and resistance range, as the maker's dimension
# table splits them: the termination length (term) grows as the resistance falls.
# Dimensions are [nominal, ±tol] or [nominal, +tol, -tol] in mm, as printed.
#
# kilib computes each row's land with IPC-7351B nominal rules from length, width and
# term (kilib::ipc, the formula of KiCad's stock chip lands): the long terminations
# are covered, without the extra copper the makers' lands carry past the part. Rows
# of one size whose lands differ by 0.05 mm or less share one land; their heights,
# merged within 0.1 mm (the taller kept), give one footprint each, named
# R_Shunt_<size>_<metric>Metric_H<height>_Pad<length>x<width>mm_Gap<gap>mm.
# maker_land is the maker's recommended land, written into the description only
# (pad_length along the body, pad_width across, gap between the pads).
#
# Datasheets (in the document library, ~/sync/datasheets/<maker>/), read 13 Nov 2026:
# - Vishay WSL doc 30100 (23 Nov 2023), WSLP doc 30122 (9 Sep 2024), WSLT2010 doc 30138,
#   WSLT2512 doc 30121, WSLS2512 doc 30123: p.2 dimensions and solder pads
#   (a = pad length, b = pad width, l = gap, as drawn).
# - Yageo PE (Z suffix) PE_Series_DS V.2 (22 Aug 2014, still current): Table 1 p.4,
#   Table 7 p.9 (A span, B gap, C pad length, D pad width).
# - Yageo PE_L (L suffix, AEC-Q200) V.10 (17 Sep 2020): Table 1 p.5, Table 7 p.10.
# - Yageo PA PYU-PA0100_2512_51_ROHS Rev 11 (24 Jun 2026): Table 1 p.4, Table 7 p.9.
# - Bourns CRF REV 09/26 p.3 (A pad width, B pad length, L gap, as drawn), CRA REV 07/26.
# - TT Electronics LRMA (06.26) p.3, tolerances ±0.2 unless stated.
# - Rohm GMR100 (gmr100-e), land from Rohm 67AN023E Rev.010 (Jan 2026).
# - Isabellenhütte SMS (28 Jan 2025).
#
# Left out: Yageo PA1206 (two builds with lands of their own), Vishay WSLF and Yageo PU
# (welded, element above the terminals), Rohm PMR/PSR, Susumu KRL and KOA TLR/PSL (no
# land published), Panasonic ERJ-M (not for new designs), 4-terminal Kelvin parts
# (Vishay WSK, Bourns CSS, TT LRMAP with sense pads).

