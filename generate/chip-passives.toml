sources = [
  "Yageo CC general purpose MLCC, DOC012001660 V.10, Table 3 p.6",
  "TDK CGA series general, 003-01/20130611, p.6 (standard thickness 0.60/0.85/1.25)",
  "Samsung CL21A225KBFNNNE spec and CL21A226KOQNNNE datasheet, dimension tables (1.25 class)",
]

# 1206: TDK and Yageo main table list 0.85, 1.15 and 1.6. Left out: 0.6 (TDK only), 0.7 and 1.0 (Yageo only, few packaging
# options). Samsung CL31 reportedly uses 0.85/1.25/1.6, not file-verified (its PDF was behind a bot wall): 1.25 is open.
[[chip]]
kind = "C"
size = "1206"
metric = "3216"
style = "mlcc"
length = 3.2
width = 1.6
band = 0.5
heights = [0.85, 1.15, 1.6]
sources = [
  "TDK CGA series general, 003-01/20130611, p.7 (standard thickness 0.60/0.85/1.15/1.60)",
  "Yageo CC general purpose MLCC, DOC012001660 V.10, Table 4 p.7, Table 6 p.9",
  "Samsung CL31 series (web summary only, not file-verified)",
]

# 1210: TDK and Yageo both list 1.25, 1.6, 2.0 and 2.5, so all four qualify by the two-makers rule. Left out as one
# maker's thin or thick specials: 0.85, 1.15, 1.5, 1.9, 2.3.
# Samsung CL32 suggested a band of 0.6 (web summary only).
[[chip]]
kind = "C"
size = "1210"
metric = "3225"
style = "mlcc"
length = 3.2
width = 2.5
band = 0.5
heights = [1.25, 1.6, 2.0, 2.5]
sources = [
  "TDK CGA series general, 003-01/20130611, p.8 (standard thickness 1.25/1.60/2.00/2.30/2.50)",
  "Yageo CC general purpose MLCC, DOC012001660 V.10, Table 5 p.8, Table 6 p.9",
  "Samsung CL32 series (web summary only, not file-verified)",
]

# 1812: the shared subset of TDK and Yageo. Left out: 2.3, 2.8, 3.2 (TDK only, thick high-voltage types) and 0.6..1.5
