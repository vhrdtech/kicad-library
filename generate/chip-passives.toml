# Nominal body dimensions and common heights of chip R, C and L (mm), the input of the chip footprint and STEP model generator.
# One footprint per (kind, size, height). Decided 13 Nov 2026: 0201..1210 for R, C and L; 2010 and 2512 for R; 1812 for C; no 01005.
# A height is listed when at least two makers list it, or one maker's main series does (said in the size's note).
# Dimensions are the makers' nominals; where makers differ in the second decimal the value matching the metric code is used.

# ---------------------------------------------------------------- capacitors (MLCC)
# Makers: Murata GRM (C02E), Samsung CL, Yageo CC (DOC012001660), TDK C/CGA (1735392).

# 0201: Yageo and TDK list only 0.3.
[[chip]]
kind = "C"
size = "0201"
metric = "0603"
style = "mlcc"
length = 0.6
width = 0.3
band = 0.15
heights = [0.3]
sources = [
  "Yageo CC general purpose MLCC, DOC012001660 V.10 (8 Jul 2014), Table 1 p.4, Table 6 p.9",
  "TDK CGA series general, 003-01/20130611, p.2 (dimensions), p.3 (standard thickness)",
  "Murata GRM general, C02E (Mar 2020), p.6, length and width only",
]

# 0402: Murata, Samsung CL05, Yageo and TDK agree on 0.5. A 0.35 low-profile 0402 (Roman's example) was not found in any
# of the four general-purpose catalogues, so it is not listed.
[[chip]]
kind = "C"
size = "0402"
metric = "1005"
style = "mlcc"
length = 1.0
width = 0.5
band = 0.25
heights = [0.5]
sources = [
  "Samsung CL05A105KQ5NNNC spec, dimension table",
  "Yageo CC general purpose MLCC, DOC012001660 V.10, Table 2 p.5, Table 6 p.9",
  "TDK CGA series general, 003-01/20130611, p.4 (standard thickness 0.50)",
]

# 0603: Samsung CL10, Yageo and TDK agree on 0.8. Left out: 0.6 (Yageo only, few packaging options).
[[chip]]
kind = "C"
size = "0603"
metric = "1608"
style = "mlcc"
length = 1.6
width = 0.8
band = 0.3
heights = [0.8]
sources = [
  "Samsung CL10A475KA8NQNC spec, dimension table",
  "Yageo CC general purpose MLCC, DOC012001660 V.10, Table 3 p.6, Table 6 p.9",
  "TDK CGA series general, 003-01/20130611, p.5 (standard thickness 0.80)",
]

# 0805: Yageo and TDK both list 0.6, 0.85 and 1.25; Samsung CL21 confirms 1.25. Nothing left out.
[[chip]]
kind = "C"
size = "0805"
metric = "2012"
style = "mlcc"
length = 2.0
width = 1.25
band = 0.5
