[[chip]]
kind = "C"
size = "1812"
metric = "4532"
style = "mlcc"
length = 4.5
width = 3.2
band = 0.5
heights = [1.6, 2.0, 2.5]
sources = [
  "TDK CGA series general, 003-01/20130611, p.9 (standard thickness 1.60/2.00/2.30/2.50/2.80/3.20)",
  "Yageo CC general purpose MLCC, DOC012001660 V.10, Table 5 p.8, Table 6 p.9",
]

