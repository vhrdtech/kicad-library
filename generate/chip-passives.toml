# ---------------------------------------------------------------- inductors
# Coilcraft HP (0402HP, 0603HP, 0805HP) has bodies larger than the EIA size it is named after (0402HP A max 1.09,
# 0603HP A max 1.75, 0805HP 2.21 x 1.73 x 1.55 max), so no nominal is taken from it; it is only a cross-check.
# Not listed: wirewound 0402, 0603 and 0805 (Murata LQW air-core RF types only, one maker, weakly sourced), and a
# multilayer 1210 (no maker lists one). TDK has no wirewound chip inductor at 0603..1206.
# Murata sources are sections of the "Chip Coils" catalogue, library file Murata/MURA-LQ.PDF (distributor copy, no page numbers).

# 0201: Murata LQP03T and TDK MLG0603S, both 0.6 x 0.3 x 0.3, end 0.15.
[[chip]]
kind = "L"
size = "0201"
metric = "0603"
style = "l_multilayer"
length = 0.6
width = 0.3
band = 0.15
heights = [0.3]
colour = "ceramic"
sources = [
  "Murata Chip Coils catalogue MURA-LQ.PDF, LQP03T_04 section",
  "TDK MLG series, 1838670.pdf (Mar 2014), MLG0603S",
]

# 0402: Murata LQG15H and TDK MLG1005S, both 1.0 x 0.5 x 0.5. TDK MLF1005-J is the ferrite version of the same body.
# Left out: 0.4 (Murata LQP15T film type, one maker).
[[chip]]
kind = "L"
size = "0402"
metric = "1005"
style = "l_multilayer"
length = 1.0
width = 0.5
band = 0.25
heights = [0.5]
colour = "ceramic"
sources = [
  "Murata Chip Coils catalogue MURA-LQ.PDF, LQG15H section",
  "TDK MLG series, 1838670.pdf (Mar 2014), MLG1005S",
  "TDK MLF-J, e511_mlf-j-270633.pdf (Sep 2013), MLF1005-J (end electrode given as 0.10 min only)",
]

