# Power inductors: body sizes, bottom electrodes and land patterns (LIB-29).
#
# One [[power]] table per family and body. The footprint name is
# L_<family>_<length>x<width>mm_H<height>, one footprint per height.
# Read from the makers' datasheets on 13 Nov 2026 (session power-l-table).
#
# Families:
# - Shielded: ferrite drum core with magnetic resin or a ferrite sleeve
#   (Sunlord SWPA/WPN, Taiyo Yuden LSXN = old NR/NRS, Bourns SRN, TDK VLS,
#   Würth WE-LQS).
# - Molded: metal-composite moulded body (Coilcraft XAL/XFL/XEL/XGL, Würth
#   WE-MAPI/WE-XHMI, Murata DFE, TDK SPM/TFM, Bourns SRP, Cyntec, Sunlord MWSA,
#   Taiyo Yuden LSEN/LSAN). Molded parts come in two land styles that need
#   different bodies: wide bottom-only electrodes (Coilcraft, Würth XHMI) and
#   narrow L-shaped lead-frame terminals (Bourns SRP, Cyntec, TDK SPM,
#   Sunlord MWSA). They differ in body size too, so they get separate rows.
#
# Rules used for every row:
# - Both families get a row where both sell the body, even where the lands
#   agree (2016): the 3D model differs.
# - The land is the one most makers share; where none is shared, the most
#   conservative one that covers every listed part's bottom electrode. A part
#   is in `fits` only when its electrode lies on the chosen pads (an inner
#   overhang of up to 0.15 mm is said in a comment).
# - Heights are the maximum heights the makers sell in that body (nominal +
#   tolerance where only a nominal is printed). Values within 0.1 mm are one
#   height: the value most makers print (ties: the higher one), so a model can
#   be up to 0.1 mm lower than the part.
# - No datasheet dimensions the corner chamfers or radii: every `corner` is an
#   estimate from the drawings.
# - The electrode (term_*) is what one representative series draws; it is
#   for the 3D model only.
#
# Left out:
# - Bourns SRN6045, SRN8040: D-shaped electrodes, not two rectangles.
# - Coilcraft XFL2006/2010 (1.9x2.0), Taiyo Yuden LSXN 2020/2424: one maker
#   per body.
# - Coilcraft XEL3515/3520, XGL3530 (3.2x3.5) and Bourns SRP3020TA (3.5x3.2):
#   no shared body (the electrodes sit on different axes).
# - TDK SPM3012/3015/3020 (3.2x3.0, narrow L-terminals): one maker.
# - TDK SPM4030 (4.2x4.0): electrode reaches 0.95 mm from centre, 0.15 inside
#   the L-terminal 4.4x4.2 pads, and its body has lugged chamfers.
# - Würth WE-MAPI5020/5030 (5.4x5.4): 1.6 mm electrodes reach 2.7 mm out,
#   0.45 past the Coilcraft 5.3x5.5 pads; one maker for its own land.
# - Bourns SRP6030CA (6.4x6.6): its terminals sit 1.8..3.2 mm out, off the
#   Coilcraft 6.4x6.6 pads; one maker.
# - Cyntec VCMT063T (6.95x6.6): gap 3.3 against 3.7 of the 7.1x6.5 row.
# - Coilcraft XAL7020/7030 (7.5x7.5), Würth WE-XHMI8080, Sunlord SWRB (12 mm):
#   one maker per body.
#
# Not filed in the library: alma-1b has no ~/sync. Every URL below can be
# fetched into it with `tpm lib fetch URL` (or `tpm lib add`) on a PC that has
# it. Datasheet URL bases:
# - Bourns: https://www.bourns.com/docs/Product-Datasheets/<name>.pdf
# - Würth: https://www.we-online.com/components/products/datasheet/<order code>.pdf
# - TDK: https://product.tdk.com/system/files/dam/doc/product/inductor/inductor/smd/catalog/<file>
# - Murata: https://pim.murata.com/asset/pim4/inductor/JETE243A-<nnnn>_PDF_INDUCTOR
# - Coilcraft: https://www.coilcraft.com/getmedia/<id>/<name>.pdf

