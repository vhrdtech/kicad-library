# TI footprints named by TI's package designator, November 2026: TI_<designator>_<generic package> (TI_DBV0005A_SOT-23-5),
# found by TI's name and by the generic one. `kilib migrate --map migrate/2026-11-ti.toml BOARD_DIR` renames the old
# footprint ids on boards, in Footprint fields and in ki_fp_filters ([footprint_rename]), and gives the placed TI
# symbols that sat on a generic footprint their TI footprint ([symbol_footprint]: the schematic's Footprint fields;
# KiCad's Update PCB from Schematic then swaps the footprint on the board). Generic footprints stay as they are.

[libraries.footprint]
"VHRD_Package_DFN_QFN" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Package_DFN_QFN.pretty"
"VHRD_Package_QFP" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Package_QFP.pretty"
