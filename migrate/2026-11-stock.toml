# Stock symbols, copied with `kilib stock import --symbols`: standalone, the Footprint field at our footprint copy,
# Mpn fields. Device:R and Device:C go to the library's own R and C, Connector_Generic:Conn_02x03_Odd_Even to
# VHRD_Connector's own, power:PWR_FLAG to VHRD_power's (made by vhrd-kicad): the same pins and graphics as stock.

[libraries.symbol]
"VHRD_74xGxx" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_74xGxx.kicad_symdir"
"VHRD_Amplifier_Operational" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_Amplifier_Operational.kicad_symdir"
"VHRD_Connector" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_Connector.kicad_symdir"
