# KiCad stock footprints that boards use, copied into this library (`kilib stock import`) so their text is ours.
# `kilib migrate --map migrate/2026-11-stock.toml BOARD_DIR` points a board's footprint ids and `Footprint` fields
# from the stock library to the copy; the name stays, only the library changes. 3D models keep KiCad's own paths.
# Stock footprints not listed here stay as they are.

[libraries.footprint]
"VHRD_Capacitor_SMD" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Capacitor_SMD.pretty"
"VHRD_Connector_PinSocket_2.54mm" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Connector_PinSocket_2.54mm.pretty"
"VHRD_Package_DFN_QFN" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Package_DFN_QFN.pretty"
"VHRD_Package_QFP" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Package_QFP.pretty"
"VHRD_Package_SO" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Package_SO.pretty"
"VHRD_Package_TO_SOT_SMD" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Package_TO_SOT_SMD.pretty"
"VHRD_Resistor_SMD" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_Resistor_SMD.pretty"
"VHRD_TestPoint" = "${VHRD_LIBRARY_DIR}/footprints/VHRD_TestPoint.pretty"

