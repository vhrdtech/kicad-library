"VHRD_Diode" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_Diode.kicad_symdir"
"VHRD_Jumper" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_Jumper.kicad_symdir"
"VHRD_Mechanical" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_Mechanical.kicad_symdir"
"VHRD_power" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_power.kicad_symdir"
"VHRD_Regulator_Linear" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_Regulator_Linear.kicad_symdir"
"VHRD_Transistor_BJT" = "${VHRD_LIBRARY_DIR}/symbols/VHRD_Transistor_BJT.kicad_symdir"

[symbol]
# "StockLib:Name" = "VHRD_StockLib" (or the VHRD library that has its own of the same name)
"74xGxx:74LVC1G17" = "VHRD_74xGxx"
